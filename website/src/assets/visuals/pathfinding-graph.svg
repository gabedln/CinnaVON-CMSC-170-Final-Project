<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="2D weighted pathfinding navigation graph across interconnected rooms">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Outer frame / obstacle walls -->
  <rect x="14" y="14" width="612" height="392" rx="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="4" />

  <!-- Passable rooms & corridors (matching Slide 2 layout) -->
  <!-- Top-left room -->
  <rect x="28" y="28" width="90" height="118" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
  <!-- Corridor down from top-left -->
  <rect x="52" y="142" width="42" height="72" fill="#ffffff" />
  <line x1="52" y1="146" x2="52" y2="210" stroke="#1e293b" stroke-width="3" />
  <line x1="94" y1="146" x2="94" y2="210" stroke="#1e293b" stroke-width="3" />

  <!-- Top-middle room -->
  <rect x="142" y="28" width="128" height="110" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
  <!-- Corridor from top-middle down -->
  <rect x="164" y="134" width="44" height="78" fill="#ffffff" />
  <line x1="164" y1="138" x2="164" y2="208" stroke="#1e293b" stroke-width="3" />
  <line x1="208" y1="138" x2="208" y2="208" stroke="#1e293b" stroke-width="3" />

  <!-- Top horizontal corridor connecting top-mid to top-right -->
  <rect x="266" y="42" width="160" height="44" fill="#ffffff" />
  <line x1="270" y1="42" x2="424" y2="42" stroke="#1e293b" stroke-width="3" />
  <line x1="270" y1="86" x2="424" y2="86" stroke="#1e293b" stroke-width="3" />

  <!-- Large bottom-left chamber -->
  <rect x="28" y="206" width="212" height="184" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
  <!-- Erase overlap borders -->
  <rect x="54" y="198" width="38" height="14" fill="#ffffff" />
  <rect x="166" y="198" width="40" height="14" fill="#ffffff" />

  <!-- Central small room -->
  <rect x="264" y="168" width="126" height="74" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
  <!-- Corridor linking bottom-left to central room -->
  <rect x="236" y="208" width="32" height="34" fill="#ffffff" />
  <line x1="240" y1="208" x2="264" y2="208" stroke="#1e293b" stroke-width="3" />
  <line x1="240" y1="242" x2="264" y2="242" stroke="#1e293b" stroke-width="3" />

  <!-- Large top-right chamber -->
  <rect x="422" y="28" width="188" height="224" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
  <rect x="416" y="44" width="12" height="40" fill="#ffffff" />
  <!-- Corridor linking central room to top-right -->
  <rect x="386" y="196" width="40" height="36" fill="#ffffff" />
  <line x1="390" y1="196" x2="422" y2="196" stroke="#1e293b" stroke-width="3" />
  <line x1="390" y1="232" x2="422" y2="232" stroke="#1e293b" stroke-width="3" />

  <!-- Bottom corridor -->
  <rect x="236" y="344" width="176" height="36" fill="#ffffff" />
  <line x1="240" y1="344" x2="408" y2="344" stroke="#1e293b" stroke-width="3" />
  <line x1="240" y1="380" x2="408" y2="380" stroke="#1e293b" stroke-width="3" />

  <!-- Bottom-middle room -->
  <rect x="404" y="302" width="102" height="88" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
  <rect x="400" y="346" width="10" height="32" fill="#ffffff" />
  <!-- Corridor down from top-right to bottom-middle -->
  <rect x="444" y="248" width="34" height="58" fill="#ffffff" />
  <line x1="444" y1="252" x2="444" y2="302" stroke="#1e293b" stroke-width="3" />
  <line x1="478" y1="252" x2="478" y2="302" stroke="#1e293b" stroke-width="3" />

  <!-- Bottom-right room -->
  <rect x="530" y="302" width="80" height="88" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
  <!-- Corridor down from top-right to bottom-right -->
  <rect x="556" y="248" width="32" height="58" fill="#ffffff" />
  <line x1="556" y1="252" x2="556" y2="302" stroke="#1e293b" stroke-width="3" />
  <line x1="588" y1="252" x2="588" y2="302" stroke="#1e293b" stroke-width="3" />

  <!-- Graph edges (gray) -->
  <g stroke="#94a3b8" stroke-width="3.2" stroke-linecap="round">
    <line x1="73" y1="62" x2="73" y2="112" />
    <line x1="73" y1="112" x2="73" y2="230" />
    <line x1="73" y1="230" x2="186" y2="225" />
    <line x1="73" y1="230" x2="112" y2="310" />
    <line x1="73" y1="230" x2="210" y2="362" />
    <line x1="112" y1="310" x2="186" y2="225" />
    <line x1="112" y1="310" x2="210" y2="362" />
    <line x1="186" y1="225" x2="210" y2="362" />
    <line x1="186" y1="225" x2="222" y2="225" />
    <line x1="222" y1="225" x2="210" y2="362" />
    <line x1="186" y1="225" x2="186" y2="110" />
    <line x1="186" y1="110" x2="196" y2="62" />
    <line x1="186" y1="110" x2="246" y2="62" />
    <line x1="196" y1="62" x2="246" y2="62" />
    <line x1="246" y1="62" x2="446" y2="62" />
    <line x1="222" y1="225" x2="288" y2="216" />
    <line x1="288" y1="216" x2="332" y2="206" />
    <line x1="332" y1="206" x2="374" y2="214" />
    <line x1="374" y1="214" x2="452" y2="214" />
    <line x1="446" y1="62" x2="520" y2="122" />
    <line x1="446" y1="62" x2="452" y2="214" />
    <line x1="446" y1="62" x2="572" y2="228" />
    <line x1="520" y1="122" x2="452" y2="214" />
    <line x1="520" y1="122" x2="572" y2="228" />
    <line x1="452" y1="214" x2="572" y2="228" />
    <line x1="452" y1="214" x2="461" y2="322" />
    <line x1="461" y1="322" x2="424" y2="362" />
    <line x1="461" y1="322" x2="466" y2="362" />
    <line x1="424" y1="362" x2="466" y2="362" />
    <line x1="210" y1="362" x2="424" y2="362" />
    <line x1="572" y1="228" x2="572" y2="322" />
    <line x1="572" y1="322" x2="578" y2="364" />
  </g>

  <!-- Highlighted optimal weighted path -->
  <g stroke="#3a86b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="73,62 73,112 73,230 186,225 222,225 288,216 332,206 374,214 452,214 572,228 572,322 578,364" />
  </g>

  <!-- Cost callout badges -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    <rect x="86" y="160" width="52" height="20" rx="4" fill="#1b4965" />
    <text x="112" y="174" fill="#ffffff" text-anchor="middle">cost = 1</text>

    <rect x="466" y="122" width="56" height="20" rx="4" fill="#3a86b7" />
    <text x="494" y="136" fill="#ffffff" text-anchor="middle">cost = √2</text>
  </g>

  <!-- Nodes -->
  <g fill="#dbeafe" stroke="#1b4965" stroke-width="2.8" filter="url(#shadow)">
    <circle cx="73" cy="62" r="10" fill="#1b4965" />
    <circle cx="73" cy="112" r="8.5" />
    <circle cx="73" cy="230" r="8.5" />
    <circle cx="112" cy="310" r="8.5" />
    <circle cx="210" cy="362" r="8.5" />
    <circle cx="186" cy="225" r="8.5" />
    <circle cx="222" cy="225" r="8.5" />
    <circle cx="186" cy="110" r="8.5" />
    <circle cx="196" cy="62" r="8.5" />
    <circle cx="246" cy="62" r="8.5" />
    <circle cx="288" cy="216" r="8.5" />
    <circle cx="332" cy="206" r="8.5" />
    <circle cx="374" cy="214" r="8.5" />
    <circle cx="446" cy="62" r="8.5" />
    <circle cx="520" cy="122" r="8.5" />
    <circle cx="452" cy="214" r="8.5" />
    <circle cx="572" cy="228" r="8.5" />
    <circle cx="461" cy="322" r="8.5" />
    <circle cx="424" cy="362" r="8.5" />
    <circle cx="466" cy="362" r="8.5" />
    <circle cx="572" cy="322" r="8.5" />
    <circle cx="578" cy="364" r="10" fill="#3a86b7" />
  </g>

  <!-- Start / Goal labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <text x="73" y="66" fill="#ffffff">S</text>
    <text x="578" y="368" fill="#ffffff">G</text>
  </g>
</svg>
