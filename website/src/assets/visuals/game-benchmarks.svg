<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Five commercial video games from the Moving AI Lab 2D Pathfinding Benchmarks">
  <defs>
    <linearGradient id="bg-dao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bg-da2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bg-wc3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bg-bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b4965" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bg-sc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Row: 3 Game Cards (DAO, DA2, WC3) matching Slide 3 layout -->
  <!-- Card 1: Dragon Age: Origins -->
  <g transform="translate(24, 24)" filter="url(#cardShadow)">
    <rect width="172" height="184" rx="10" fill="url(#bg-dao)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="14" width="52" height="22" rx="4" fill="#ffffff" fill-opacity="0.16" />
    <text x="40" y="29" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">dao</text>
    <text x="86" y="88" fill="#ffffff" font-family="Georgia, serif" font-size="18" font-weight="700" text-anchor="middle">Dragon Age:</text>
    <text x="86" y="112" fill="#fca5a5" font-family="Georgia, serif" font-size="17" font-weight="700" text-anchor="middle">Origins</text>
    <line x1="36" y1="132" x2="136" y2="132" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="86" y="152" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">BioWare (2009)</text>
    <text x="86" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">156 Maps · RPG</text>
  </g>

  <!-- Card 2: Dragon Age II -->
  <g transform="translate(214, 24)" filter="url(#cardShadow)">
    <rect width="172" height="184" rx="10" fill="url(#bg-da2)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="14" width="52" height="22" rx="4" fill="#ffffff" fill-opacity="0.16" />
    <text x="40" y="29" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">da2</text>
    <text x="86" y="88" fill="#ffffff" font-family="Georgia, serif" font-size="18" font-weight="700" text-anchor="middle">Dragon Age</text>
    <text x="86" y="112" fill="#fca5a5" font-family="Georgia, serif" font-size="19" font-weight="700" text-anchor="middle">II</text>
    <line x1="36" y1="132" x2="136" y2="132" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="86" y="152" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">BioWare (2011)</text>
    <text x="86" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">67 Maps · RPG</text>
  </g>

  <!-- Card 3: Warcraft III -->
  <g transform="translate(404, 24)" filter="url(#cardShadow)">
    <rect width="172" height="184" rx="10" fill="url(#bg-wc3)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="14" width="96" height="22" rx="4" fill="#ffffff" fill-opacity="0.16" />
    <text x="62" y="29" fill="#f8fafc" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">wc3maps512</text>
    <text x="86" y="88" fill="#ffffff" font-family="Georgia, serif" font-size="18" font-weight="700" text-anchor="middle">Warcraft III</text>
    <text x="86" y="112" fill="#86efac" font-family="Georgia, serif" font-size="13.5" font-weight="700" text-anchor="middle">512 × 512 Scaled</text>
    <line x1="36" y1="132" x2="136" y2="132" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="86" y="152" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Blizzard (2002)</text>
    <text x="86" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">36 Maps · RTS</text>
  </g>

  <!-- Bottom Row: 2 Centered Game Cards (Baldur's Gate II & StarCraft) -->
  <!-- Card 4: Baldur's Gate II -->
  <g transform="translate(94, 230)" filter="url(#cardShadow)">
    <rect width="196" height="184" rx="10" fill="url(#bg-bg2)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="14" width="122" height="22" rx="4" fill="#ffffff" fill-opacity="0.16" />
    <text x="75" y="29" fill="#f8fafc" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">bgmaps &amp; bg512</text>
    <text x="98" y="88" fill="#ffffff" font-family="Georgia, serif" font-size="18" font-weight="700" text-anchor="middle">Baldur's Gate II</text>
    <text x="98" y="112" fill="#93c5fd" font-family="Georgia, serif" font-size="13.5" font-weight="700" text-anchor="middle">Original &amp; 512×512</text>
    <line x1="38" y1="132" x2="158" y2="132" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="98" y="152" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">BioWare (2000)</text>
    <text x="98" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">120 + 75 Maps · RPG</text>
  </g>

  <!-- Card 5: StarCraft -->
  <g transform="translate(310, 230)" filter="url(#cardShadow)">
    <rect width="196" height="184" rx="10" fill="url(#bg-sc1)" stroke="#334155" stroke-width="1.5" />
    <rect x="14" y="14" width="52" height="22" rx="4" fill="#ffffff" fill-opacity="0.16" />
    <text x="40" y="29" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">sc1</text>
    <text x="98" y="88" fill="#ffffff" font-family="Georgia, serif" font-size="20" font-weight="700" text-anchor="middle">StarCraft</text>
    <text x="98" y="112" fill="#93c5fd" font-family="Georgia, serif" font-size="13.5" font-weight="700" text-anchor="middle">Large RTS Arenas</text>
    <line x1="38" y1="132" x2="158" y2="132" stroke="#ffffff" stroke-opacity="0.25" />
    <text x="98" y="152" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Blizzard (1998)</text>
    <text x="98" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">75 Maps · RTS</text>
  </g>
</svg>
