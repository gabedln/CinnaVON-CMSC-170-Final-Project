<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420" role="img" aria-label="8-connected octile grid movement rules and Python standard library implementation">
  <rect width="540" height="420" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Title bar -->
  <text x="270" y="38" fill="#1b4965" font-family="Georgia, serif" font-size="18" font-weight="700" text-anchor="middle">8-Connected Octile Grid &amp; No-Corner-Cutting</text>
  <text x="270" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="middle">Implemented from scratch in Python (heapq, set, dict)</text>

  <!-- 3x3 grid centered -->
  <g transform="translate(135, 80)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="90" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="90" y="0" width="90" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Top-right is blocked (Tree 'T') to illustrate no corner cutting -->
    <rect x="180" y="0" width="90" height="90" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
    <!-- Row 1 -->
    <rect x="0" y="90" width="90" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="90" y="90" width="90" height="90" fill="#1b4965" stroke="#1b4965" stroke-width="2" />
    <rect x="180" y="90" width="90" height="90" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <!-- Row 2 -->
    <rect x="0" y="180" width="90" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="90" y="180" width="90" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="180" y="180" width="90" height="90" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />

    <!-- Obstacle label in (2,1) -->
    <text x="225" y="131" fill="#ffffff" font-family="monospace" font-size="22" font-weight="700" text-anchor="middle">T</text>
    <text x="225" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Obstacle</text>

    <!-- Current cell label -->
    <text x="135" y="132" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Current</text>
    <text x="135" y="150" fill="#8ecae6" font-family="monospace" font-size="12" text-anchor="middle">(x, y)</text>

    <!-- Valid cardinal arrows (cost 1) -->
    <g stroke="#1b4965" stroke-width="3.5" stroke-linecap="round">
      <line x1="135" y1="90" x2="135" y2="54" />
      <line x1="135" y1="180" x2="135" y2="216" />
      <line x1="90" y1="135" x2="54" y2="135" />
    </g>
    <g fill="#1b4965" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <text x="135" y="42">N (1)</text>
      <text x="135" y="238">S (1)</text>
      <text x="45" y="139">W (1)</text>
    </g>

    <!-- Valid diagonal arrows (cost sqrt(2)) -->
    <g stroke="#3a86b7" stroke-width="3.2" stroke-linecap="round">
      <line x1="96" y1="96" x2="62" y2="62" />
      <line x1="96" y1="174" x2="62" y2="208" />
    </g>
    <g fill="#3a86b7" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
      <text x="45" y="48">NW (√2)</text>
      <text x="45" y="232">SW (√2)</text>
    </g>

    <!-- Blocked diagonal moves (no corner cutting) -->
    <g stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,4">
      <line x1="174" y1="96" x2="210" y2="60" />
      <line x1="174" y1="174" x2="210" y2="210" />
    </g>
    <g fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
      <text x="225" y="44">NE ✕</text>
      <text x="225" y="60" font-size="10" font-weight="600">No corner cut</text>
      <text x="225" y="226">SE ✕</text>
      <text x="225" y="242" font-size="10" font-weight="600">No corner cut</text>
    </g>
  </g>

  <!-- Bottom algorithm summary badges -->
  <g transform="translate(26, 366)" font-family="system-ui, sans-serif" font-size="12" font-weight="700">
    <rect x="0" y="0" width="154" height="34" rx="8" fill="#1b4965" />
    <text x="77" y="21" fill="#ffffff" text-anchor="middle">UCS: f(n) = g(n)</text>

    <rect x="167" y="0" width="154" height="34" rx="8" fill="#3a86b7" />
    <text x="244" y="21" fill="#ffffff" text-anchor="middle">A*: g(n) + h(n)</text>

    <rect x="334" y="0" width="154" height="34" rx="8" fill="#8ecae6" />
    <text x="411" y="21" fill="#0f172a" text-anchor="middle">HC: min h(n)</text>
  </g>
</svg>
