<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Optimal A* pathfinding route navigating obstacles in a 2D game environment">
  <!-- Background grid -->
  <rect width="600" height="360" rx="14" fill="#1e293b" />
  <g stroke="#334155" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40" /><line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="120" x2="600" y2="120" /><line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="200" x2="600" y2="200" /><line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="280" x2="600" y2="280" /><line x1="0" y1="320" x2="600" y2="320" />
    <line x1="40" y1="0" x2="40" y2="360" /><line x1="80" y1="0" x2="80" y2="360" />
    <line x1="120" y1="0" x2="120" y2="360" /><line x1="160" y1="0" x2="160" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" /><line x1="240" y1="0" x2="240" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" /><line x1="320" y1="0" x2="320" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" /><line x1="400" y1="0" x2="400" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" /><line x1="480" y1="0" x2="480" y2="360" />
    <line x1="520" y1="0" x2="520" y2="360" /><line x1="560" y1="0" x2="560" y2="360" />
  </g>

  <!-- Subtle UCS explored zone -->
  <circle cx="96" cy="92" r="210" fill="#1b4965" fill-opacity="0.32" />
  <!-- Subtle A* focused corridor -->
  <polygon points="80,76 260,210 340,295 450,185 520,105 495,70 375,180 315,245 130,65" fill="#3a86b7" fill-opacity="0.30" />

  <!-- Obstacles (game buildings / barriers like Slide 8) -->
  <g fill="#475569" stroke="#94a3b8" stroke-width="2">
    <rect x="160" y="55" width="76" height="44" rx="4" />
    <rect x="65" y="185" width="90" height="46" rx="4" />
    <rect x="240" y="110" width="46" height="125" rx="4" />
    <rect x="330" y="65" width="52" height="150" rx="4" />
    <rect x="382" y="170" width="68" height="45" rx="4" />
    <rect x="200" y="275" width="95" height="40" rx="4" />
    <rect x="440" y="245" width="95" height="55" rx="4" />
  </g>

  <!-- Hill Climbing trapped line (dashed red/light blue) -->
  <polyline points="96,92 152,132 232,158" fill="none" stroke="#f87171" stroke-width="3.2" stroke-dasharray="6,5" stroke-linecap="round" />
  <circle cx="232" cy="158" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <text x="180" y="176" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">HC trapped</text>

  <!-- Optimal A* path (bright green/cyan like Slide 8) -->
  <polyline points="96,92 195,185 224,252 325,264 366,240 468,184 516,102" fill="none" stroke="#4ade80" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Start & Goal markers -->
  <circle cx="96" cy="92" r="11" fill="#3a86b7" stroke="#ffffff" stroke-width="2.5" />
  <text x="96" y="96" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">S</text>

  <circle cx="516" cy="102" r="11" fill="#22c55e" stroke="#ffffff" stroke-width="2.5" />
  <text x="516" y="106" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">G</text>

  <!-- Legend bar at bottom -->
  <rect x="20" y="316" width="560" height="30" rx="6" fill="#0f172a" fill-opacity="0.82" />
  <g font-family="system-ui, sans-serif" font-size="11.5" fill="#e2e8f0">
    <line x1="38" y1="331" x2="64" y2="331" stroke="#4ade80" stroke-width="4" />
    <text x="72" y="335">A* Optimal Path (100% Complete, 2.62× Faster)</text>
    <line x1="360" y1="331" x2="386" y2="331" stroke="#f87171" stroke-width="3" stroke-dasharray="5,4" />
    <text x="394" y="335">HC Local Minimum Trap</text>
  </g>
</svg>
