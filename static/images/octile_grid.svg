<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="8-connected octile grid movement costs and no corner cutting">
  <rect x="0" y="0" width="360" height="360" fill="#ffffff" rx="12"/>

  <!-- Title -->
  <text x="180" y="34" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1e293b">8-Connected Octile Grid</text>
  <text x="180" y="54" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748b">Cardinal = 1  |  Diagonal = &#x221A;2  |  No Corner Cutting</text>

  <!-- 3x3 Grid centered at (180, 195), cell size 74 -->
  <g transform="translate(69, 80)">
    <!-- Cells -->
    <!-- Row 0 -->
    <rect x="0" y="0" width="74" height="74" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="74" y="0" width="74" height="74" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="148" y="0" width="74" height="74" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <!-- Row 1 -->
    <rect x="0" y="74" width="74" height="74" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="74" y="74" width="74" height="74" fill="#1e3a5f" stroke="#1e293b" stroke-width="2"/>
    <rect x="148" y="74" width="74" height="74" fill="#475569" stroke="#334155" stroke-width="2"/>
    <!-- Row 2 -->
    <rect x="0" y="148" width="74" height="74" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="74" y="148" width="74" height="74" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="148" y="148" width="74" height="74" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>

    <!-- Obstacle label in E cell -->
    <text x="185" y="108" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Wall</text>
    <text x="185" y="124" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">(@ / T)</text>

    <!-- Current cell label -->
    <text x="111" y="108" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Current</text>
    <text x="111" y="124" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#93c5fd">(x, y)</text>

    <!-- Cardinal move arrows & costs -->
    <!-- North -->
    <line x1="111" y1="74" x2="111" y2="44" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="111,34 106,45 116,45" fill="#2563eb"/>
    <text x="111" y="24" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">N (1)</text>

    <!-- South -->
    <line x1="111" y1="148" x2="111" y2="178" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="111,188 106,177 116,177" fill="#2563eb"/>
    <text x="111" y="208" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">S (1)</text>

    <!-- West -->
    <line x1="74" y1="111" x2="48" y2="111" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="38,111 49,106 49,116" fill="#2563eb"/>
    <text x="20" y="115" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">W (1)</text>

    <!-- Valid Diagonals (NW, SW) -->
    <!-- NW -->
    <line x1="78" y1="78" x2="48" y2="48" stroke="#0ea5e9" stroke-width="2.4"/>
    <polygon points="41,41 53,45 45,53" fill="#0ea5e9"/>
    <text x="35" y="27" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0284c7">NW (&#x221A;2)</text>

    <!-- SW -->
    <line x1="78" y1="144" x2="48" y2="174" stroke="#0ea5e9" stroke-width="2.4"/>
    <polygon points="41,181 45,169 53,177" fill="#0ea5e9"/>
    <text x="35" y="206" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0284c7">SW (&#x221A;2)</text>

    <!-- Blocked Diagonals (NE, SE) due to East wall -->
    <line x1="144" y1="78" x2="176" y2="46" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="185" y="34" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Blocked</text>
    <text x="185" y="48" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#dc2626">(Corner Cut)</text>

    <line x1="144" y1="144" x2="176" y2="176" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="185" y="196" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Blocked</text>
    <text x="185" y="210" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#dc2626">(Corner Cut)</text>
  </g>

  <!-- Footer badge -->
  <rect x="44" y="318" width="272" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="336" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Implemented from scratch in Python (heapq)</text>
</svg>
