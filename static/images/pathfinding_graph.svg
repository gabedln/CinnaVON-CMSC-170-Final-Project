<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" role="img" aria-label="2D weighted pathfinding graph across rooms and corridors">
  <!-- Outer obstacle wall background -->
  <rect x="4" y="4" width="532" height="352" fill="#b8bcc2" stroke="#1e293b" stroke-width="4" rx="4"/>

  <!-- Passable rooms and corridors (white walkable interior) -->
  <path d="
    M 18 18 H 92 V 104 H 68 V 168 H 136 V 104 H 112 V 18 H 206 V 42 H 316 V 26 H 516 V 196 H 496 V 256 H 522 V 342 H 442 V 256 H 462 V 196 H 386 V 256 H 404 V 342 H 302 V 314 H 188 V 342 H 18 V 168 H 42 V 104 H 18 Z
  " fill="#ffffff" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="miter"/>

  <!-- Inner central wall block 1 (top-center obstacle) -->
  <rect x="196" y="76" width="124" height="72" fill="#b8bcc2" stroke="#1e293b" stroke-width="3.5"/>
  <!-- Inner alcove/corridor wall block 2 (bottom-center obstacle) -->
  <path d="M 196 196 H 294 V 170 H 336 V 274 H 196 Z" fill="#b8bcc2" stroke="#1e293b" stroke-width="3.5"/>

  <!-- Weighted graph edges -->
  <g stroke="#7c8594" stroke-width="3.2" stroke-linecap="round">
    <!-- Left room chain -->
    <line x1="55" y1="50" x2="55" y2="96"/>
    <line x1="55" y1="96" x2="55" y2="188"/>
    <!-- Left-bottom chamber mesh -->
    <line x1="55" y1="188" x2="152" y2="188"/>
    <line x1="55" y1="188" x2="94" y2="262"/>
    <line x1="55" y1="188" x2="174" y2="306"/>
    <line x1="94" y1="262" x2="152" y2="188"/>
    <line x1="94" y1="262" x2="174" y2="306"/>
    <line x1="94" y1="262" x2="184" y2="210"/>
    <line x1="152" y1="188" x2="174" y2="306"/>
    <line x1="152" y1="188" x2="184" y2="210"/>
    <line x1="184" y1="210" x2="174" y2="306"/>

    <!-- Top-middle room -->
    <line x1="152" y1="188" x2="152" y2="96"/>
    <line x1="152" y1="96" x2="162" y2="54"/>
    <line x1="152" y1="96" x2="206" y2="54"/>
    <line x1="162" y1="54" x2="206" y2="54"/>
    <line x1="206" y1="54" x2="352" y2="54"/>

    <!-- Center passage -->
    <line x1="184" y1="210" x2="226" y2="206"/>
    <line x1="226" y1="206" x2="260" y2="176"/>
    <line x1="260" y1="176" x2="296" y2="176"/>
    <line x1="296" y1="176" x2="350" y2="168"/>

    <!-- Right-top chamber mesh -->
    <line x1="352" y1="54" x2="350" y2="168"/>
    <line x1="352" y1="54" x2="416" y2="108"/>
    <line x1="352" y1="54" x2="478" y2="192"/>
    <line x1="416" y1="108" x2="350" y2="168"/>
    <line x1="416" y1="108" x2="366" y2="196"/>
    <line x1="416" y1="108" x2="478" y2="192"/>
    <line x1="350" y1="168" x2="366" y2="196"/>
    <line x1="350" y1="168" x2="478" y2="192"/>
    <line x1="366" y1="196" x2="478" y2="192"/>

    <!-- Bottom corridor & chambers -->
    <line x1="174" y1="306" x2="324" y2="306"/>
    <line x1="324" y1="306" x2="366" y2="306"/>
    <line x1="324" y1="306" x2="366" y2="262"/>
    <line x1="366" y1="196" x2="366" y2="262"/>
    <line x1="366" y1="262" x2="366" y2="306"/>

    <!-- Far-right room -->
    <line x1="478" y1="192" x2="478" y2="262"/>
    <line x1="478" y1="262" x2="486" y2="306"/>
  </g>

  <!-- Highlighted shortest path overlay (subtle blue accent) -->
  <polyline points="55,50 55,96 55,188 152,188 184,210 226,206 260,176 296,176 350,168 478,192 478,262 486,306"
            fill="none" stroke="#2563eb" stroke-width="3.6" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Graph nodes -->
  <g fill="#dbeafe" stroke="#1e293b" stroke-width="2.6">
    <circle cx="55" cy="50" r="10.5" fill="#2563eb"/>
    <circle cx="55" cy="96" r="10.5"/>
    <circle cx="55" cy="188" r="10.5"/>
    <circle cx="94" cy="262" r="10.5"/>
    <circle cx="152" cy="188" r="10.5"/>
    <circle cx="152" cy="96" r="10.5"/>
    <circle cx="162" cy="54" r="10.5"/>
    <circle cx="206" cy="54" r="10.5"/>
    <circle cx="174" cy="306" r="10.5"/>
    <circle cx="184" cy="210" r="10.5"/>
    <circle cx="226" cy="206" r="10.5"/>
    <circle cx="260" cy="176" r="10.5"/>
    <circle cx="296" cy="176" r="10.5"/>
    <circle cx="352" cy="54" r="10.5"/>
    <circle cx="416" cy="108" r="10.5"/>
    <circle cx="350" cy="168" r="10.5"/>
    <circle cx="366" cy="196" r="10.5"/>
    <circle cx="366" cy="262" r="10.5"/>
    <circle cx="324" cy="306" r="10.5"/>
    <circle cx="366" cy="306" r="10.5"/>
    <circle cx="478" cy="192" r="10.5"/>
    <circle cx="478" cy="262" r="10.5"/>
    <circle cx="486" cy="306" r="10.5" fill="#0ea5e9"/>
  </g>
</svg>
